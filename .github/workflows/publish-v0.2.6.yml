name: Publish v0.2.6 release
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.6.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          mkdir -p dist/forge-neo-settings-plus
          cp README.md CHANGELOG.md LICENSE style.css dist/forge-neo-settings-plus/
          cp -R scripts javascript dist/forge-neo-settings-plus/
          (cd dist && zip -qr ../forge-neo-settings-plus-v0.2.6.zip forge-neo-settings-plus)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.6 forge-neo-settings-plus-v0.2.6.zip --target "$GITHUB_SHA" --title "Forge Neo Settings++ v0.2.6" --notes "First public release of Forge Neo Settings++ for Forge Neo. Includes Extra Networks Cards / No Preview / List modes, additional card appearance options, and original icon-size / maximum-resolution settings. Tested on Forge Neo (neo) for Windows. See README and CHANGELOG for features and installation."
